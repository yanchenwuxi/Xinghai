name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  jvm-check:
    name: JVM 解析层自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile stubs + pure modules + run JvmCheck
        run: |
          set -e
          OUT=build/testout
          mkdir -p build/stubs
          # minimal android stubs (same as local verification)
          python3 << 'PY'
          from pathlib import Path
          base = Path("build/stubs")
          files = {
            "android/content/Context.java": 'package android.content; public class Context { public static final String CONNECTIVITY_SERVICE="connectivity"; public Object getSystemService(String n){return null;} public android.content.res.Resources getResources(){return new android.content.res.Resources();} }',
            "android/content/res/Resources.java": "package android.content.res; public class Resources { public android.util.DisplayMetrics getDisplayMetrics(){return new android.util.DisplayMetrics();} }",
            "android/graphics/Color.java": "package android.graphics; public class Color { public static final int WHITE=0xFFFFFFFF; public static final int BLACK=0xFF000000; public static int parseColor(String s){return 0;} }",
            "android/graphics/Typeface.java": "package android.graphics; public class Typeface { public static final Typeface DEFAULT=new Typeface(); public static final Typeface DEFAULT_BOLD=new Typeface(); public static final int BOLD=1; public static Typeface create(Typeface t,int s){return DEFAULT;} }",
            "android/graphics/PorterDuff.java": "package android.graphics; public class PorterDuff { public enum Mode { SRC_IN, SRC_ATOP, MULTIPLY, CLEAR } }",
            "android/graphics/drawable/Drawable.java": "package android.graphics.drawable; public class Drawable { public void setColorFilter(int c, android.graphics.PorterDuff.Mode m){} }",
            "android/net/ConnectivityManager.java": "package android.net; public class ConnectivityManager { public NetworkInfo getActiveNetworkInfo(){return null;} }",
            "android/net/NetworkInfo.java": "package android.net; public class NetworkInfo { public boolean isConnected(){return false;} }",
            "android/text/TextUtils.java": "package android.text; public class TextUtils { public enum TruncateAt { END, START, MIDDLE, MARQUEE } public static boolean isEmpty(CharSequence s){return s==null||s.length()==0;} }",
            "android/util/TypedValue.java": "package android.util; public class TypedValue { public static final int COMPLEX_UNIT_DIP=1; public static final int COMPLEX_UNIT_SP=2; public static float applyDimension(int u,float v,DisplayMetrics m){return v;} }",
            "android/util/DisplayMetrics.java": "package android.util; public class DisplayMetrics { public float density=2f; }",
            "android/view/Gravity.java": "package android.view; public class Gravity { public static final int CENTER=17; public static final int CENTER_VERTICAL=16; public static final int START=8388611; }",
            "android/widget/LinearLayout.java": "package android.widget; public class LinearLayout { public static final int HORIZONTAL=0; public static final int VERTICAL=1; public static class LayoutParams { public LayoutParams(int w,int h){} public LayoutParams(int w,int h,float w2){} public void setMargins(int a,int b,int c,int d){} public int gravity; public float weight; } public LinearLayout(android.content.Context c){} public void setOrientation(int o){} public void setGravity(int g){} public void setPadding(int a,int b,int c,int d){} public void addView(Object v){} public void addView(Object v, LayoutParams p){} public void setLayoutParams(Object p){} public void setBackgroundColor(int c){} }",
            "android/widget/TextView.java": "package android.widget; public class TextView { public TextView(android.content.Context c){} public void setText(CharSequence s){} public void setTextSize(float s){} public void setTextSize(int u,float s){} public void setTextColor(int c){} public void setTypeface(android.graphics.Typeface t){} public void setGravity(int g){} public void setPadding(int a,int b,int c,int d){} public void setMaxLines(int n){} public void setEllipsize(android.text.TextUtils.TruncateAt a){} public void setSingleLine(){} public void setSingleLine(boolean b){} public void setLayoutParams(Object p){} public void setBackgroundColor(int c){} }",
            "android/widget/Toast.java": "package android.widget; public class Toast { public static final int LENGTH_SHORT=0; public static Toast makeText(android.content.Context c,CharSequence s,int d){return new Toast();} public void show(){} }",
            "com/zaka/xinghai/core/App.java": "package com.zaka.xinghai.core; import android.content.Context; public class App { public static Context ctx(){return null;} public static void onUi(Runnable r){if(r!=null)r.run();} public static void run(Runnable r){if(r!=null)r.run();} public static void image(Runnable r){if(r!=null)r.run();} }",
          }
          for rel, src in files.items():
              path = base / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(src)
          PY
          find build/stubs -name '*.java' > /tmp/stubs.txt
          javac -encoding UTF-8 -source 8 -target 8 -d "$OUT" @/tmp/stubs.txt
          cat > /tmp/src.txt << 'SRC'
          app/src/main/java/com/zaka/xinghai/model/Cate.java
          app/src/main/java/com/zaka/xinghai/model/Vod.java
          app/src/main/java/com/zaka/xinghai/model/Filter.java
          app/src/main/java/com/zaka/xinghai/model/Site.java
          app/src/main/java/com/zaka/xinghai/model/Record.java
          app/src/main/java/com/zaka/xinghai/util/U.java
          app/src/main/java/com/zaka/xinghai/net/Http.java
          app/src/main/java/com/zaka/xinghai/net/AdFilter.java
          app/src/main/java/com/zaka/xinghai/net/Cms.java
          app/src/main/java/com/zaka/xinghai/net/Cfg.java
          app/src/main/java/com/zaka/xinghai/subtitle/Cue.java
          app/src/main/java/com/zaka/xinghai/subtitle/SubParse.java
          test/JvmCheck.java
          SRC
          # strip leading spaces from paths
          sed -i 's/^ *//' /tmp/src.txt
          javac -encoding UTF-8 -nowarn -source 8 -target 8 -cp "$OUT:build/libs/json.jar" -d "$OUT" @/tmp/src.txt
          java -cp "$OUT:build/libs/json.jar" JvmCheck build/fixtures

  android-build:
    name: Android 命令行打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform & build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Build APK (unsigned aligned)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          bash build/build.sh || {
            echo "::warning::build.sh failed, showing script head for debug"
            head -80 build/build.sh
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xinghai-apk
          path: |
            build/out/*.apk
          if-no-files-found: warn
